[package]
name = "monkeybyte"
version = "0.1.0"
edition = "2021"
description = "MonkeyByte agent chat — Rust rewrite (egui UI, rodio audio, threaded streaming)"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json", "multipart"] }
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
hound = "3"

cpal = "0.15" # dictation — needs libasound2-dev on Ubuntu
